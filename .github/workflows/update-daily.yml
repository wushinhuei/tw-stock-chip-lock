name: update daily candidate data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * 1-5'

permissions:
  contents: write

concurrency:
  group: official-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore official-data cache
        uses: actions/cache@v4
        with:
          path: data/cache.json
          key: official-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            official-data-${{ runner.os }}-      - run: npm test
      - run: npm run update:daily
        continue-on-error: true
      - run: npm run validate:output
      - name: Commit snapshot and explicit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/latest.json web/data/latest.js web/data/outcomes.json web/data/outcomes.js data/observations.json
          git diff --cached --quiet || git commit -m "Update daily official-data snapshot"
          git push
