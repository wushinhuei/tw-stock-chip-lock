<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="台股籌碼共振選股與資料完整性儀表板">
  <title>籌碼鎖碼追蹤</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div><span class="eyebrow">TWSE · MOPS · TDCC</span><h1>籌碼鎖碼追蹤</h1></div>
    <div id="statusBadge" class="status blocked">BLOCKED</div>
  </header>
  <main>
    <section class="hero">
      <div><p>籌碼決定觀察方向，技術面決定進出時點。僅提供研究、警示與紀錄，不會自動下單。</p><strong id="statusText">正在讀取資料狀態…</strong></div>
      <button id="notifyButton" type="button">啟用瀏覽器通知</button>
    </section>
    <section><h2>資料完整性</h2><div id="sourceCards" class="source-grid"></div><div id="warnings" class="warnings"></div></section>
    <section><h2>一年機械代理回測</h2><div id="backtestCard" class="hero"><span>正在讀取回測狀態…</span></div></section>
    <section><div class="section-title"><h2>每週候選</h2><span id="candidateCount"></span></div><div id="candidateList" class="candidate-grid"></div></section>
    <section><div class="section-title"><h2>人工複核資料</h2><div><button id="exportButton" type="button">匯出</button><label class="import-label">匯入<input id="importInput" type="file" accept="application/json"></label></div></div><p>資料只儲存在這個瀏覽器；最多核准三檔。</p></section>
  </main>
  <template id="candidateTemplate">
    <article class="candidate-card">
      <div class="candidate-head"><div><span class="symbol"></span><h3 class="name"></h3></div><label><input class="approved" type="checkbox"> 核准</label></div>
      <div class="metrics"></div>
      <div class="review-grid">
        <label>確認頸線<input class="neckline" type="number" min="0" step="0.01"></label>
        <label>20日分點集中度<input class="branch-concentration" type="number" step="0.01" placeholder="例如 0.12"></label>
        <label>分點資料日期<input class="source-date" type="date"></label>
        <label>分點來源網址<input class="source-url" type="url"></label>
      </div>
      <div class="checks">
        <label><input class="daytrade-risk" type="checkbox"> 隔日沖風險</label>
        <label><input class="platform-confirmed" type="checkbox"> 已確認2至3月平台</label>
        <label><input class="mops-checked" type="checkbox"> 已查MOPS／股東會／除權息</label>
        <label><input class="stagnation" type="checkbox"> 高檔爆量滯漲</label>
        <label><input class="upper-shadow" type="checkbox"> 長上影線</label>
        <label><input class="black-candle" type="checkbox"> 黑K</label>
      </div>
      <label>判讀備註<textarea class="notes" rows="3"></textarea></label>
      <div class="live-status"></div>
    </article>
  </template>
  <script src="config.js"></script>
  <script src="data/latest.js"></script>
  <script src="data/backtest.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
