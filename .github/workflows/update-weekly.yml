name: update weekly candidates

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 6'

permissions:
  contents: write

concurrency:
  group: official-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run update:weekly
        continue-on-error: true
      - run: npm run validate:output
      - name: Commit verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/latest.json web/data/latest.js web/data/outcomes.json web/data/outcomes.js data/observations.json data/tdcc
          git diff --cached --quiet || git commit -m "Update weekly official-data snapshot"
          git push
