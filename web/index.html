<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="台股籌碼、技術與月營收潛力股雷達">
  <title>潛力股雷達</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div><span class="eyebrow">TWSE · MOPS · TDCC</span><h1>潛力股雷達</h1><p class="subtitle">籌碼 × 技術 × 月營收</p></div><div><div id="statusBadge" class="status blocked">UNAVAILABLE</div><small id="generatedAt">尚未更新</small></div></header>
  <main>
    <section class="hero"><div><p>籌碼確認方向、技術判斷蓄勢、月營收補強基本面。只提供研究名單，不管理持倉、不下單。</p><strong id="statusText">正在讀取資料狀態…</strong></div></section>
    <section id="summaryCards" class="summary-grid"></section>
    <section><div class="section-title"><h2>資料完整性</h2><button id="toggleSources" class="secondary" type="button">展開來源</button></div><div id="sourcePanel" hidden><div id="sourceCards" class="source-grid"></div><div id="warnings" class="warnings"></div></div></section>
    <section>
      <div class="section-title"><div><h2>潛力股排行榜</h2><p class="muted">基本門檻先篩，再依可用資料評分；不為湊數放寬條件。</p></div><strong id="candidateCount"></strong></div>
      <div class="toolbar">
        <label>搜尋<input id="searchInput" type="search" placeholder="代號或名稱"></label>
        <label>等級<select id="gradeFilter"><option value="">全部</option><option>A</option><option>B</option><option>C</option></select></label>
        <label>營收<select id="revenueFilter"><option value="">全部</option><option value="high">36月新高</option><option value="other">非新高</option></select></label>
        <label class="check-inline"><input id="showExcluded" type="checkbox"> 顯示已排除</label>
      </div>
      <div id="provisionalNote" class="notice" hidden></div><div id="candidateList" class="candidate-grid"></div>
    </section>
    <section><h2>向前觀察成效</h2><div id="outcomeCard" class="hero"><span>正在讀取觀察紀錄…</span></div></section>
    <section><div class="section-title"><h2>人工研究資料</h2><div><button id="exportButton" type="button">匯出</button><label class="import-label">匯入<input id="importInput" type="file" accept="application/json"></label></div></div><p>人工分點、型態與重大訊息判讀只儲存在這個瀏覽器；可追蹤或排除任意股票。</p></section>
  </main>
  <template id="candidateTemplate"><article class="candidate-card">
    <div class="candidate-head"><div><span class="rank"></span><span class="symbol"></span><h3 class="name"></h3></div><div><strong class="grade"></strong> <strong class="score"></strong></div></div>
    <div class="badges"></div><div class="metrics"></div><div class="reasons"></div>
    <details class="score-details"><summary>查看評分拆解</summary><div class="score-breakdown"></div></details>
    <div class="review-grid">
      <label>20日分點集中度<input class="branch-concentration" type="number" step="0.01" placeholder="例如 0.12"></label>
      <label>分點資料日期<input class="source-date" type="date"></label>
      <label>分點來源網址<input class="source-url" type="url"></label>
      <label>研究備註<textarea class="notes" rows="3"></textarea></label>
    </div>
    <div class="checks">
      <label><input class="tracked" type="checkbox"> 加入追蹤</label><label><input class="excluded" type="checkbox"> 排除</label>
      <label><input class="mops-checked" type="checkbox"> MOPS已檢查</label><label><input class="daytrade-risk" type="checkbox"> 隔日沖集中</label>
      <label><input class="stagnation" type="checkbox"> 高檔滯漲</label><label><input class="upper-shadow" type="checkbox"> 長上影線</label>
    </div>
  </article></template>
  <script src="config.js"></script><script src="data/latest.js"></script><script src="data/outcomes.js"></script><script defer src="app.js"></script>
</body></html>
